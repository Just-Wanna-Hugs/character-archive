<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Character Archive">
<title>Character Archive</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#08080d;--bg1:rgba(177,119,255,.16);--bg2:rgba(226,184,91,.1);--bg3:rgba(118,75,210,.11);--text:#f6f2fa;--muted:#898594;--card:rgba(255,255,255,.035);--border:rgba(255,255,255,.075);--input:rgba(255,255,255,.045);--iborder:rgba(255,255,255,.09);--gold:#e1ba61;--goldg:linear-gradient(135deg,#f5dda0,#c49642);--modal:rgba(16,16,23,.95);--overlay:rgba(0,0,0,.78);--empty:rgba(255,255,255,.07);--shadow:rgba(0,0,0,.25)}
body.light{--bg:#f4f0f8;--bg1:rgba(177,119,255,.12);--bg2:rgba(226,184,91,.08);--bg3:rgba(118,75,210,.08);--text:#1a1520;--muted:#6b6575;--card:rgba(255,255,255,.85);--border:rgba(0,0,0,.08);--input:rgba(255,255,255,.9);--iborder:rgba(0,0,0,.12);--gold:#c49642;--modal:rgba(255,255,255,.97);--overlay:rgba(0,0,0,.45);--empty:rgba(0,0,0,.1);--shadow:rgba(0,0,0,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Arial,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 8%,var(--bg1),transparent 28%),radial-gradient(circle at 88% 15%,var(--bg2),transparent 25%),radial-gradient(circle at 80% 90%,var(--bg3),transparent 30%),var(--bg);overflow-x:hidden;transition:background .35s,color .35s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(128,128,128,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(128,128,128,.04) 1px,transparent 1px);background-size:45px 45px;mask-image:linear-gradient(to bottom,black,transparent 85%);z-index:-1}
.app{width:min(1450px,calc(100% - 70px));margin:0 auto;padding:38px 0 80px}
.header{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:22px}
.logo{font-size:30px;font-weight:900;letter-spacing:1.5px;text-shadow:0 0 25px rgba(224,184,94,.12)}
.subtitle{margin-top:8px;color:var(--muted);font-size:14px}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search,.sort-select,.theme-btn,.secondary-button,.lang-btn{height:46px;border:1px solid var(--iborder);border-radius:14px;outline:none;color:var(--text);background:var(--input);backdrop-filter:blur(12px);font-size:14px;font-weight:600;cursor:pointer;transition:transform .2s,border-color .2s}
.search{width:230px;padding:0 16px;box-shadow:0 8px 25px var(--shadow)}.search::placeholder{color:var(--muted)}
.search:focus,.form-input:focus{border-color:rgba(226,184,91,.55);box-shadow:0 0 0 3px rgba(226,184,91,.07)}
.sort-select,.theme-btn,.secondary-button,.lang-btn{padding:0 14px}.theme-btn,.lang-btn{min-width:46px;font-size:15px}
.sort-select:hover,.theme-btn:hover,.secondary-button:hover,.lang-btn:hover{border-color:rgba(225,188,101,.4);transform:translateY(-1px)}
.add-character-button{height:46px;padding:0 18px;border:none;border-radius:14px;color:#19150d;font-size:14px;font-weight:800;background:var(--goldg);box-shadow:0 7px 25px rgba(218,173,77,.2);cursor:pointer;transition:transform .22s,filter .22s}
.add-character-button:hover{transform:translateY(-3px);filter:brightness(1.08)}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.stat-item{padding:10px 16px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--muted);backdrop-filter:blur(10px)}
.stat-item strong{color:var(--text);font-weight:700;margin-right:4px}
.filter-panel{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:28px}
.filter{height:38px;padding:0 15px;border:1px solid var(--border);border-radius:999px;color:var(--muted);background:var(--card);backdrop-filter:blur(12px);cursor:pointer;transition:.2s}
.filter:hover{color:var(--text);transform:translateY(-1px)}.filter.active{color:#17130c;border-color:var(--gold);background:var(--goldg);box-shadow:0 5px 20px rgba(224,184,91,.2)}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:24px}
.card{position:relative;height:370px;overflow:hidden;border:1px solid var(--border);border-radius:22px;background:var(--card);box-shadow:0 15px 45px var(--shadow);cursor:pointer;opacity:0;transform:translateY(18px);animation:cardIn .45s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .3s,border-color .3s,box-shadow .3s}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.card:hover{transform:translateY(-8px);border-color:rgba(225,188,101,.45);box-shadow:0 25px 60px rgba(0,0,0,.35),0 0 30px rgba(225,188,101,.1)}
.card-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#15151c;transition:transform .55s}
.card:hover .card-image{transform:scale(1.05)}
.card-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,transparent 25%,rgba(0,0,0,.5) 55%,rgba(0,0,0,.92))}
body.light .card-overlay{background:linear-gradient(to bottom,transparent 20%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.78))}
.card-content{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:18px 16px 16px}
.card-name{margin:0 0 6px;font-size:19px;font-weight:850;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.6)}
.card-fandom{display:inline-block;max-width:100%;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:7px;color:#e8e2f0;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);font-size:12px;margin-bottom:8px}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;max-height:44px;overflow:hidden}
.tag{display:inline-flex;align-items:center;max-width:100%;padding:4px 8px;border:1px solid rgba(255,255,255,.13);border-radius:999px;color:rgba(255,255,255,.88);background:rgba(255,255,255,.10);backdrop-filter:blur(8px);font-size:10px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-more{color:rgba(255,255,255,.65);background:rgba(225,188,101,.12);border-color:rgba(225,188,101,.2)}
.modal-tags{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px}
.modal-tags .tag{font-size:12px;padding:6px 10px;color:var(--gold);background:rgba(225,188,101,.10);border-color:rgba(225,188,101,.2)}
.tags-help{margin-top:6px;color:var(--muted);font-size:11px;line-height:1.4}
.card-desc{margin:0;color:rgba(255,255,255,.75);font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.favorite-button,.edit-button,.delete-button{position:absolute;z-index:12;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid rgba(255,255,255,.15);border-radius:50%;color:#eee;background:rgba(5,5,9,.6);backdrop-filter:blur(12px);cursor:pointer;transition:.2s}
.favorite-button{top:13px;right:13px;font-size:18px}.favorite-button:hover{color:#ff6687;transform:scale(1.1)}.favorite-button.active{color:#ff5e84}
.edit-button{top:13px;left:13px;opacity:0}.delete-button{top:58px;left:13px;opacity:0}
.card:hover .edit-button,.card:hover .delete-button{opacity:1}.edit-button:hover{color:#e4c46e}.delete-button:hover{color:#ff6b79}
.empty{grid-column:1/-1;padding:100px 20px;text-align:center;color:var(--muted);border:1px dashed var(--empty);border-radius:24px;background:var(--card)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);z-index:200;display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:14px;background:rgba(20,20,28,.95);border:1px solid rgba(255,255,255,.12);color:#f0ecf5;box-shadow:0 15px 40px rgba(0,0,0,.4);backdrop-filter:blur(16px);opacity:0;transition:.35s cubic-bezier(.2,.8,.2,1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast button{padding:6px 14px;border:none;border-radius:8px;background:var(--goldg);color:#19150d;font-weight:700;cursor:pointer}
.modal,.add-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:30px;background:var(--overlay);backdrop-filter:blur(14px);opacity:0;transition:opacity .25s}
.modal.show,.add-modal.show{display:flex;opacity:1}
.modal-box{position:relative;width:min(920px,100%);max-height:90vh;display:grid;grid-template-columns:45% 55%;overflow:hidden;border:1px solid var(--border);border-radius:27px;background:var(--modal);box-shadow:0 35px 100px rgba(0,0,0,.5);transform:scale(.96) translateY(12px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.modal.show .modal-box{transform:scale(1) translateY(0)}.modal-image{width:100%;height:600px;object-fit:cover;background:#15151c}
.modal-info{align-self:center;padding:45px}
.modal-info h2{margin:0 0 13px;font-size:34px;line-height:1.15}
.modal-universe{display:inline-block;margin-bottom:20px;padding:7px 11px;border-radius:9px;color:var(--gold);background:rgba(225,188,101,.12);border:1px solid rgba(225,188,101,.2)}
.modal-description{margin:0;color:var(--muted);line-height:1.75;font-size:15px}
.close,.add-modal-close{position:absolute;top:15px;right:15px;z-index:30;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:50%;color:var(--text);background:rgba(0,0,0,.5);font-size:24px;cursor:pointer;transition:.2s}
.close:hover,.add-modal-close:hover{transform:rotate(90deg) scale(1.08);color:var(--gold)}
.add-modal-box{position:relative;width:min(610px,100%);max-height:92vh;overflow-y:auto;padding:35px;border:1px solid var(--border);border-radius:27px;background:var(--modal);box-shadow:0 35px 100px rgba(0,0,0,.5);transform:scale(.96) translateY(12px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.add-modal.show .add-modal-box{transform:scale(1) translateY(0)}.add-title{font-size:28px;font-weight:850}.add-subtitle{margin:7px 0 25px;color:var(--muted);font-size:14px}
.upload-area{position:relative;height:220px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--iborder);border-radius:18px;background:var(--input);cursor:pointer;transition:.25s;overflow:hidden}
.upload-area:hover,.upload-area.dragover{border-color:rgba(225,188,101,.5);background:rgba(225,188,101,.06)}
.upload-placeholder{text-align:center;pointer-events:none}.upload-icon{font-size:40px;color:var(--gold)}.upload-title{margin-top:8px;font-weight:750}.upload-text{margin-top:6px;color:var(--muted);font-size:12px}
.upload-preview{display:none;width:100%;height:100%;object-fit:cover}
.form-label{display:block;margin:14px 0 7px;color:var(--muted);font-size:13px;font-weight:600}
.form-input{width:100%;min-height:44px;padding:11px 13px;border:1px solid var(--iborder);border-radius:12px;outline:none;color:var(--text);background:var(--input);transition:.2s}
.form-textarea{min-height:100px;resize:vertical;line-height:1.5}
.save-character-button{width:100%;height:48px;margin-top:22px;border:none;border-radius:14px;color:#18140c;font-weight:850;background:var(--goldg);cursor:pointer;transition:.2s}
.save-character-button:hover{transform:translateY(-2px);filter:brightness(1.07)}
@media(max-width:900px){
  .header{flex-direction:column;align-items:stretch;gap:18px}
  .header-actions{width:100%}
  .search{flex:1;min-width:140px}
  .modal-box{grid-template-columns:1fr;max-height:94vh;overflow-y:auto}
  .modal-image{height:360px;max-height:45vh}
  .modal-info{padding:28px}
}
@media(max-width:600px){
  .app{width:calc(100% - 20px);padding:18px 0 45px}
  .header{gap:15px;margin-bottom:16px}
  .logo{font-size:20px;letter-spacing:1px}
  .subtitle{font-size:12px;margin-top:6px}
  .header-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .search{grid-column:1/-1;width:100%;height:44px}
  .sort-select,.theme-btn,.secondary-button,.lang-btn,.add-character-button{width:100%;height:42px}
  .add-character-button{grid-column:1/-1}
  #exportButton,#importButton{font-size:12px;padding:0 8px}
  .stats{gap:7px;margin-bottom:15px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stat-item{flex:0 0 auto;padding:8px 11px;font-size:11px}
  .filter-panel{flex-wrap:nowrap;overflow-x:auto;gap:7px;margin-bottom:18px;padding-bottom:5px;scrollbar-width:none}
  .filter-panel::-webkit-scrollbar{display:none}
  .filter{flex:0 0 auto;height:34px;padding:0 12px;font-size:12px}
  .catalog{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{height:270px;border-radius:15px}
  .card-content{padding:13px 11px 12px}
  .card-name{font-size:14px;margin-bottom:5px}
  .card-fandom{font-size:10px;padding:4px 7px;margin-bottom:5px}
  .card-desc{font-size:10px;line-height:1.35}
  .card-tags{gap:4px;max-height:38px}
  .tag{font-size:8px;padding:4px 6px}
  .favorite-button,.edit-button,.delete-button{width:32px;height:32px}
  .favorite-button{top:8px;right:8px;font-size:15px}
  .edit-button{top:8px;left:8px}
  .delete-button{top:47px;left:8px}
  .modal,.add-modal{padding:8px}
  .modal-box{border-radius:20px}
  .modal-image{height:300px;max-height:42vh}
  .modal-info{padding:20px 18px 24px}
  .modal-info h2{font-size:26px}
  .modal-description{font-size:14px;line-height:1.6}
  .modal-tags{margin-bottom:16px}
  .modal-tags .tag{font-size:11px}
  .close,.add-modal-close{top:10px;right:10px;width:38px;height:38px}
  .add-modal-box{padding:20px 15px;border-radius:20px}
  .add-title{font-size:23px}
  .upload-area{height:180px}
}

.install-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-color:rgba(225,188,101,.28);background:rgba(225,188,101,.08);color:var(--gold)}
.install-button:hover{background:rgba(225,188,101,.15);border-color:rgba(225,188,101,.45)}
@media(max-width:680px){.install-button{grid-column:1/-1;width:100%;min-height:44px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div>
  <div class="logo">✦ CHARACTER ARCHIVE</div>
  <div class="subtitle" data-i18n="subtitle">Мультифандомный каталог персонажей</div>
</div>
<div class="header-actions">
  <input id="search" class="search" type="text" data-i18n-placeholder="searchPlaceholder" placeholder="🔍 Имя, фандом, описание...">
  <select id="sortSelect" class="sort-select">
    <option value="date-desc" data-i18n="sortNewest">Новые сначала</option>
    <option value="date-asc" data-i18n="sortOldest">Старые сначала</option>
    <option value="name-asc" data-i18n="sortNameAsc">Имя А–Я</option>
    <option value="name-desc" data-i18n="sortNameDesc">Имя Я–А</option>
    <option value="favorites" data-i18n="sortFavorites">Сначала избранные</option>
  </select>
  <button id="langBtn" class="lang-btn" title="Language">EN</button>
  <button id="themeBtn" class="theme-btn" title="Theme">🌙</button>
  <button id="exportButton" class="secondary-button" data-i18n="export">⬇ Экспорт</button>
  <button id="importButton" class="secondary-button" data-i18n="import">⬆ Импорт</button>
  <button id="installButton" class="secondary-button install-button" data-i18n="install">📲 Установить</button>
  <input id="importInput" type="file" accept=".json" hidden>
  <button id="addCharacterButton" class="add-character-button" data-i18n="add">＋ Добавить</button>
</div>
</header>
<div id="stats" class="stats"></div>
<nav id="filterPanel" class="filter-panel"></nav>
<main id="catalog" class="catalog"></main>
</div>

<div id="toast" class="toast">
  <span id="toastText"></span>
  <button id="undoBtn" data-i18n="undo">Отменить</button>
</div>

<div id="characterModal" class="modal">
  <div class="modal-box">
    <button id="close" class="close">×</button>
    <img id="modalImage" class="modal-image" src="" alt="">
    <div class="modal-info">
      <h2 id="modalName"></h2>
      <div id="modalUniverse" class="modal-universe"></div>
      <div id="modalTags" class="modal-tags"></div>
      <p id="modalDescription" class="modal-description"></p>
    </div>
  </div>
</div>

<div id="addModal" class="add-modal">
  <div class="add-modal-box">
    <button id="addModalClose" class="add-modal-close">×</button>
    <div id="formTitle" class="add-title" data-i18n="addTitle">Добавить персонажа</div>
    <div class="add-subtitle" data-i18n="addSubtitle">Создай новую карточку</div>
    <div id="uploadArea" class="upload-area">
      <div id="uploadPlaceholder" class="upload-placeholder">
        <div class="upload-icon">＋</div>
        <div class="upload-title" data-i18n="uploadTitle">Выбери или перетащи изображение</div>
        <div class="upload-text" data-i18n="uploadText">Автоматически сожмётся</div>
      </div>
      <img id="uploadPreview" class="upload-preview" src="" alt="">
      <input id="imageInput" type="file" accept="image/*" hidden>
    </div>
    <label class="form-label" data-i18n="labelName">Имя</label>
    <input id="characterNameInput" class="form-input" type="text" data-i18n-placeholder="placeholderName" placeholder="Homura Akemi">
    <label class="form-label" data-i18n="labelFandom">Фандом</label>
    <input id="characterFandomInput" class="form-input" type="text" data-i18n-placeholder="placeholderFandom" placeholder="Madoka Magica">
    <label class="form-label" data-i18n="labelTags">Теги</label>
    <input id="characterTagsInput" class="form-input" type="text" data-i18n-placeholder="placeholderTags" placeholder="Архонт, Дендро, Лоли">
    <div class="tags-help" data-i18n="tagsHelp">Введи теги через запятую</div>
    <label class="form-label" data-i18n="labelDescription">Описание</label>
    <textarea id="characterDescriptionInput" class="form-input form-textarea" data-i18n-placeholder="placeholderDescription" placeholder="Description..."></textarea>
    <button id="saveCharacterButton" class="save-character-button" data-i18n="save">Добавить в каталог</button>
  </div>
</div>

<script>
const i18n = {
  ru: {
    subtitle: "Мультифандомный каталог персонажей",
    searchPlaceholder: "🔍 Имя, фандом, описание...",
    sortNewest: "Новые сначала",
    sortOldest: "Старые сначала",
    sortNameAsc: "Имя А–Я",
    sortNameDesc: "Имя Я–А",
    sortFavorites: "Сначала избранные",
    export: "⬇ Экспорт",
    import: "⬆ Импорт",
    install: "📲 Установить",
    installHint: "Если окно установки не появилось, откройте меню браузера и выберите «Установить Character Archive». Сайт должен быть открыт через HTTPS.",
    add: "＋ Добавить",
    undo: "Отменить",
    addTitle: "Добавить персонажа",
    editTitle: "Редактировать",
    addSubtitle: "Создай новую карточку",
    uploadTitle: "Выбери или перетащи изображение",
    uploadText: "Автоматически сожмётся",
    labelName: "Имя",
    labelFandom: "Фандом",
    labelDescription: "Описание",
    placeholderName: "Хомура Акэми",
    placeholderFandom: "Madoka Magica",
    placeholderDescription: "Описание...",
    save: "Добавить в каталог",
    saveEdit: "Сохранить",
    characters: "персонажей",
    favorites: "в избранном",
    fandoms: "фандомов",
    all: "Все",
    favFilter: "♥ Избранное",
    emptyTitle: "Каталог пока пуст",
    emptyText: "Добавь первого персонажа",
    nothingFound: "Ничего не найдено.",
    noDescription: "Описание отсутствует.",
    deleted: "удалён",
    enterName: "Введите имя",
    enterFandom: "Введите фандом",
    needImage: "Нужно изображение",
    imageError: "Ошибка обработки изображения",
    saveError: "Не удалось сохранить (слишком большие изображения)",
    catalogEmpty: "Каталог пуст",
    noData: "Нет данных",
    importDone: "Импорт завершён",
    importError: "Ошибка чтения файла",
    unsaved: "Есть несохранённые изменения. Закрыть?",
    importConfirm: "Найдено {n}.\nОК — заменить\nОтмена — добавить"
  },
  en: {
    subtitle: "Multi-fandom character catalog",
    searchPlaceholder: "🔍 Name, fandom, description...",
    sortNewest: "Newest first",
    sortOldest: "Oldest first",
    sortNameAsc: "Name A–Z",
    sortNameDesc: "Name Z–A",
    sortFavorites: "Favorites first",
    export: "⬇ Export",
    import: "⬆ Import",
    install: "📲 Install",
    installHint: "If the install window did not appear, open your browser menu and choose “Install Character Archive”. The site must be opened over HTTPS.",
    add: "＋ Add",
    undo: "Undo",
    addTitle: "Add character",
    editTitle: "Edit",
    addSubtitle: "Create a new card",
    uploadTitle: "Choose or drop an image",
    uploadText: "Automatically compressed",
    labelName: "Name",
    labelFandom: "Fandom",
    labelDescription: "Description",
    placeholderName: "Homura Akemi",
    placeholderFandom: "Madoka Magica",
    placeholderDescription: "Description...",
    save: "Add to catalog",
    saveEdit: "Save",
    characters: "characters",
    favorites: "favorites",
    fandoms: "fandoms",
    all: "All",
    favFilter: "♥ Favorites",
    emptyTitle: "Catalog is empty",
    emptyText: "Add your first character",
    nothingFound: "Nothing found.",
    noDescription: "No description.",
    deleted: "deleted",
    enterName: "Enter a name",
    enterFandom: "Enter a fandom",
    needImage: "Image required",
    imageError: "Image processing error",
    saveError: "Failed to save (images too large)",
    catalogEmpty: "Catalog is empty",
    noData: "No data",
    importDone: "Import complete",
    importError: "File read error",
    unsaved: "You have unsaved changes. Close?",
    importConfirm: "Found {n}.\nOK — replace\nCancel — merge"
  }
};

let lang = localStorage.getItem("character_archive_lang") || "ru";
const t = (key) => i18n[lang][key] || key;

const $ = id => document.getElementById(id);
const catalog = $("catalog"), filterPanel = $("filterPanel"), statsEl = $("stats");
const search = $("search"), sortSelect = $("sortSelect"), themeBtn = $("themeBtn"), langBtn = $("langBtn");
const addCharacterButton = $("addCharacterButton"), characterModal = $("characterModal"), addModal = $("addModal");
const closeBtn = $("close"), addModalClose = $("addModalClose"), uploadArea = $("uploadArea");
const imageInput = $("imageInput"), uploadPreview = $("uploadPreview"), uploadPlaceholder = $("uploadPlaceholder");
const characterNameInput = $("characterNameInput"), characterFandomInput = $("characterFandomInput");
const characterTagsInput = $("characterTagsInput"), characterDescriptionInput = $("characterDescriptionInput");
const saveCharacterButton = $("saveCharacterButton"), formTitle = $("formTitle");
const modalImage = $("modalImage"), modalName = $("modalName");
const modalUniverse = $("modalUniverse"), modalTags = $("modalTags"), modalDescription = $("modalDescription");
const exportButton = $("exportButton"), importButton = $("importButton"), importInput = $("importInput");
const toast = $("toast"), toastText = $("toastText"), undoBtn = $("undoBtn");

let characters = [], currentFilter = "all", editingId = null, currentImage = "", formDirty = false;
let lastDeleted = null, undoTimer = null, savedScrollY = 0;

function applyI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (i18n[lang][key]) el.textContent = i18n[lang][key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.getAttribute("data-i18n-placeholder");
    if (i18n[lang][key]) el.placeholder = i18n[lang][key];
  });
  // sort options
  sortSelect.querySelectorAll("option").forEach(opt => {
    const key = opt.getAttribute("data-i18n");
    if (key && i18n[lang][key]) opt.textContent = i18n[lang][key];
  });
  langBtn.textContent = lang === "ru" ? "EN" : "RU";
  document.documentElement.lang = lang;
}

langBtn.onclick = () => {
  lang = lang === "ru" ? "en" : "ru";
  localStorage.setItem("character_archive_lang", lang);
  applyI18n();
  renderStats();
  renderFilters();
  renderCatalog();
};

function loadTheme() {
  if (localStorage.getItem("character_archive_theme") === "light") {
    document.body.classList.add("light");
    themeBtn.textContent = "☀️";
  } else themeBtn.textContent = "🌙";
}
themeBtn.onclick = () => {
  document.body.classList.toggle("light");
  const light = document.body.classList.contains("light");
  themeBtn.textContent = light ? "☀️" : "🌙";
  localStorage.setItem("character_archive_theme", light ? "light" : "dark");
};

function loadCharacters() {
  try {
    const s = localStorage.getItem("character_archive_v3");
    if (s) characters = JSON.parse(s).map(normalize);
  } catch { characters = []; }
}
function saveCharacters() {
  try { localStorage.setItem("character_archive_v3", JSON.stringify(characters)); }
  catch { showToast(t("saveError")); }
}

function compressImage(file, maxW = 900, q = 0.75) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function handleImageFile(file) {
  if (!file?.type.startsWith("image/")) return showToast(t("needImage"));
  try {
    currentImage = await compressImage(file);
    uploadPreview.src = currentImage;
    uploadPreview.style.display = "block";
    uploadPlaceholder.style.display = "none";
    formDirty = true;
  } catch { showToast(t("imageError")); }
}

function renderStats() {
  const total = characters.length;
  const favs = characters.filter(c => c.favorite).length;
  const fandoms = new Set(characters.map(c => (c.fandom || "").trim()).filter(Boolean)).size;
  statsEl.innerHTML = `
    <div class="stat-item"><strong>${total}</strong> ${t("characters")}</div>
    <div class="stat-item"><strong>${favs}</strong> ${t("favorites")}</div>
    <div class="stat-item"><strong>${fandoms}</strong> ${t("fandoms")}</div>`;
}

function renderFilters() {
  filterPanel.innerHTML = "";
  const make = (type, textValue) => {
    const b = document.createElement("button");
    b.className = "filter" + (currentFilter === type ? " active" : "");
    b.textContent = textValue;
    b.onclick = () => { currentFilter = type; renderFilters(); renderCatalog(); };
    filterPanel.appendChild(b);
  };

  make("all", t("all"));
  make("favorites", t("favFilter"));

  [...new Set(characters.map(c => (c.fandom || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, lang === "ru" ? "ru" : "en"))
    .forEach(f => make("fandom:" + f, f));

  [...new Set(characters.flatMap(c => Array.isArray(c.tags) ? c.tags : []))]
    .map(tag => String(tag).trim()).filter(Boolean)
    .sort((a, b) => a.localeCompare(b, lang === "ru" ? "ru" : "en"))
    .forEach(tag => make("tag:" + tag, "#" + tag));
}

function getSortedFiltered() {
  const q = search.value.trim().toLowerCase();
  let list = characters.filter(c => {
    const tags = Array.isArray(c.tags) ? c.tags : [];
    const searchable = [c.name, c.fandom, c.description, ...tags];
    const match = !q || searchable.some(v => (v || "").toLowerCase().includes(q));

    if (currentFilter === "favorites") return match && c.favorite;
    if (currentFilter.startsWith("fandom:")) return match && c.fandom === currentFilter.slice(7);
    if (currentFilter.startsWith("tag:")) return match && tags.includes(currentFilter.slice(4));
    return match;
  });

  const s = sortSelect.value;
  list.sort((a, b) => {
    if (s === "name-asc") return (a.name || "").localeCompare(b.name || "", lang === "ru" ? "ru" : "en");
    if (s === "name-desc") return (b.name || "").localeCompare(a.name || "", lang === "ru" ? "ru" : "en");
    if (s === "date-asc") return (a.createdAt || 0) - (b.createdAt || 0);
    if (s === "favorites") return (b.favorite - a.favorite) || ((b.createdAt || 0) - (a.createdAt || 0));
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
  return list;
}

function renderCatalog() {
  catalog.innerHTML = "";
  const list = getSortedFiltered();
  if (!list.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = characters.length === 0
      ? `<div style="font-size:42px;opacity:.5;margin-bottom:12px">✦</div>
         <div style="font-size:17px;margin-bottom:6px">${t("emptyTitle")}</div>
         <div>${t("emptyText")}</div>`
      : t("nothingFound");
    catalog.appendChild(e);
    return;
  }
  list.forEach((c, i) => {
    const card = createCard(c);
    card.style.animationDelay = Math.min(i * 0.04, 0.4) + "s";
    catalog.appendChild(card);
  });
}

function createCard(c) {
  const card = document.createElement("article");
  card.className = "card";

  const img = document.createElement("img");
  img.className = "card-image";
  img.src = c.image || createPlaceholder(c.name);
  img.alt = c.name;

  const overlay = document.createElement("div");
  overlay.className = "card-overlay";

  const fav = document.createElement("button");
  fav.className = "favorite-button" + (c.favorite ? " active" : "");
  fav.innerHTML = c.favorite ? "♥" : "♡";
  fav.onclick = e => {
    e.stopPropagation();
    c.favorite = !c.favorite;
    saveCharacters();
    renderStats(); renderFilters(); renderCatalog();
  };

  const edit = document.createElement("button");
  edit.className = "edit-button";
  edit.textContent = "✎";
  edit.onclick = e => { e.stopPropagation(); openEdit(c); };

  const del = document.createElement("button");
  del.className = "delete-button";
  del.textContent = "×";
  del.onclick = e => { e.stopPropagation(); deleteCharacter(c); };

  const content = document.createElement("div");
  content.className = "card-content";

  const desc = (c.description || "").trim();
  const tags = Array.isArray(c.tags) ? c.tags.filter(Boolean) : [];
  const visibleTags = tags.slice(0, 3);
  const more = tags.length > 3 ? `<span class="tag tag-more">+${tags.length - 3}</span>` : "";

  content.innerHTML = `
    <h3 class="card-name">${esc(c.name)}</h3>
    <div class="card-fandom">${esc(c.fandom)}</div>
    ${tags.length ? `<div class="card-tags">${visibleTags.map(tag => `<span class="tag">${esc(tag)}</span>`).join("")}${more}</div>` : ""}
    ${desc ? `<p class="card-desc">${esc(desc)}</p>` : ""}`;

  card.append(img, overlay, fav, edit, del, content);
  card.onclick = () => openCharacter(c);
  return card;
}

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function createPlaceholder(name) {
  const t = esc(name || "Character");
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><rect width="600" height="800" fill="#191521"/><circle cx="300" cy="300" r="100" fill="none" stroke="#c39a52" stroke-opacity=".3" stroke-width="3"/><text x="300" y="460" text-anchor="middle" fill="#8d8797" font-size="28" font-family="Arial">${t}</text></svg>`
  );
}

function deleteCharacter(c) {
  lastDeleted = {...c};
  characters = characters.filter(i => i.id !== c.id);
  saveCharacters();
  if (currentFilter.startsWith("fandom:") && !characters.some(i => i.fandom === currentFilter.slice(7)))
    currentFilter = "all";
  if (currentFilter.startsWith("tag:") && !characters.some(i => Array.isArray(i.tags) && i.tags.includes(currentFilter.slice(4))))
    currentFilter = "all";
  renderStats(); renderFilters(); renderCatalog();
  showUndoToast(c.name);
}
function showUndoToast(name) {
  toastText.textContent = `«${name}» ${t("deleted")}`;
  toast.querySelector("button").style.display = "";
  toast.classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { toast.classList.remove("show"); lastDeleted = null; }, 6000);
}
function showToast(text) {
  toastText.textContent = text;
  toast.querySelector("button").style.display = "none";
  toast.classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => {
    toast.classList.remove("show");
    toast.querySelector("button").style.display = "";
  }, 3000);
}
undoBtn.onclick = () => {
  if (!lastDeleted) return;
  characters.push(lastDeleted);
  saveCharacters();
  lastDeleted = null;
  toast.classList.remove("show");
  clearTimeout(undoTimer);
  renderStats(); renderFilters(); renderCatalog();
};

function openCharacter(c) {
  modalImage.src = c.image || createPlaceholder(c.name);
  modalName.textContent = c.name;
  modalUniverse.textContent = c.fandom;

  const tags = Array.isArray(c.tags) ? c.tags.filter(Boolean) : [];
  modalTags.innerHTML = tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join("");
  modalTags.style.display = tags.length ? "flex" : "none";

  modalDescription.textContent = c.description || t("noDescription");
  characterModal.classList.add("show");
}

closeBtn.onclick = () => characterModal.classList.remove("show");
characterModal.onclick = e => { if (e.target === characterModal) characterModal.classList.remove("show"); };

function openAddForm() {
  editingId = null; currentImage = ""; formDirty = false;
  formTitle.textContent = t("addTitle");
  saveCharacterButton.textContent = t("save");
  characterNameInput.value = characterFandomInput.value = characterDescriptionInput.value = "";
  characterTagsInput.value = "";
  uploadPreview.src = ""; uploadPreview.style.display = "none";
  uploadPlaceholder.style.display = "block"; imageInput.value = "";
  addModal.classList.add("show");
}
function tryCloseAddModal() {
  if (formDirty && !confirm(t("unsaved"))) return;
  addModal.classList.remove("show");
  formDirty = false;
  window.scrollTo(0, savedScrollY);
}
addCharacterButton.onclick = () => { savedScrollY = window.scrollY; openAddForm(); };
addModalClose.onclick = tryCloseAddModal;
addModal.onclick = e => { if (e.target === addModal) tryCloseAddModal(); };
[characterNameInput, characterFandomInput, characterTagsInput, characterDescriptionInput].forEach(el => el.oninput = () => formDirty = true);

uploadArea.onclick = () => imageInput.click();
imageInput.onchange = () => { if (imageInput.files[0]) handleImageFile(imageInput.files[0]); };
uploadArea.ondragover = e => { e.preventDefault(); uploadArea.classList.add("dragover"); };
uploadArea.ondragleave = () => uploadArea.classList.remove("dragover");
uploadArea.ondrop = e => {
  e.preventDefault(); uploadArea.classList.remove("dragover");
  if (e.dataTransfer.files[0]) handleImageFile(e.dataTransfer.files[0]);
};

saveCharacterButton.onclick = () => {
  const name = characterNameInput.value.trim();
  const fandom = characterFandomInput.value.trim();
  const tags = [...new Set(characterTagsInput.value.split(",").map(tag => tag.trim()).filter(Boolean))];
  const description = characterDescriptionInput.value.trim();
  if (!name) return showToast(t("enterName")), characterNameInput.focus();
  if (!fandom) return showToast(t("enterFandom")), characterFandomInput.focus();
  if (editingId) {
    const c = characters.find(i => i.id === editingId);
    if (!c) return;
    Object.assign(c, { name, fandom, tags, description });
    if (currentImage) c.image = currentImage;
  } else {
    characters.push({
      id: Date.now() + "_" + Math.random().toString(36).slice(2),
      name, fandom, tags, description, image: currentImage,
      favorite: false, createdAt: Date.now()
    });
  }
  formDirty = false;
  saveCharacters();
  renderStats(); renderFilters(); renderCatalog();
  tryCloseAddModal();
};

function openEdit(c) {
  savedScrollY = window.scrollY;
  editingId = c.id; currentImage = c.image || ""; formDirty = false;
  formTitle.textContent = t("editTitle");
  saveCharacterButton.textContent = t("saveEdit");
  characterNameInput.value = c.name || "";
  characterFandomInput.value = c.fandom || "";
  characterTagsInput.value = Array.isArray(c.tags) ? c.tags.join(", ") : "";
  characterDescriptionInput.value = c.description || "";
  imageInput.value = "";
  if (c.image) {
    uploadPreview.src = c.image;
    uploadPreview.style.display = "block";
    uploadPlaceholder.style.display = "none";
  } else {
    uploadPreview.style.display = "none";
    uploadPlaceholder.style.display = "block";
  }
  addModal.classList.add("show");
}

exportButton.onclick = () => {
  if (!characters.length) return showToast(t("catalogEmpty"));
  const data = { version: 4, exportedAt: new Date().toISOString(), characters };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = `character-archive-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
};
importButton.onclick = () => importInput.click();
importInput.onchange = () => {
  const file = importInput.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      let imported = Array.isArray(data) ? data : (data.characters || []);
      const valid = imported.filter(i => i?.name && i?.fandom);
      if (!valid.length) return showToast(t("noData"));
      const replace = confirm(t("importConfirm").replace("{n}", valid.length));
      if (replace) characters = valid.map(normalize);
      else {
        const ids = new Set(characters.map(c => c.id));
        valid.forEach(item => {
          const c = normalize(item);
          if (ids.has(c.id)) c.id = Date.now() + "_" + Math.random().toString(36).slice(2);
          characters.push(c);
        });
      }
      saveCharacters();
      currentFilter = "all";
      renderStats(); renderFilters(); renderCatalog();
      showToast(t("importDone"));
    } catch { showToast(t("importError")); }
    importInput.value = "";
  };
  r.readAsText(file);
};
function normalize(item) {
  return {
    id: item.id || Date.now() + "_" + Math.random().toString(36).slice(2),
    name: String(item.name || "").trim(),
    fandom: String(item.fandom || "").trim(),
    tags: Array.isArray(item.tags)
      ? [...new Set(item.tags.map(tag => String(tag).trim()).filter(Boolean))]
      : [],
    description: String(item.description || "").trim(),
    image: item.image || "",
    favorite: !!item.favorite,
    createdAt: item.createdAt || Date.now()
  };
}

search.oninput = renderCatalog;
sortSelect.onchange = renderCatalog;
document.onkeydown = e => {
  if (e.key === "Escape") {
    characterModal.classList.remove("show");
    tryCloseAddModal();
  }
};

let deferredInstallPrompt = null;
const installButton = document.getElementById("installButton");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installButton.style.display = "inline-flex";
});

installButton.onclick = async () => {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    const result = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if (result.outcome === "accepted") installButton.style.display = "none";
    return;
  }

  const message = (typeof t === "function" ? t("installHint") : "Откройте меню браузера и выберите установку сайта. Сайт должен быть открыт через HTTPS.");
  if (typeof showToast === "function") showToast(message);
  else alert(message);
};

window.addEventListener("appinstalled", () => {
  installButton.style.display = "none";
  deferredInstallPrompt = null;
});

if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true) {
  installButton.style.display = "none";
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}

loadTheme();
applyI18n();
loadCharacters();
renderStats();
renderFilters();
renderCatalog();
</script>
</body>
</html>
